<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>maiReport 문서함</title>
<style>
:root{--bg:#f1f5f9;--side:#0f172a;--side-2:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg)}
body{display:flex;height:100dvh;overflow:hidden}
nav{flex:0 0 220px;background:var(--side);color:var(--text);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#4338ca,#0891b2);display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.brand b{font-size:14px}.brand small{display:block;font-size:10px;color:var(--muted)}
.sec{font-size:10px;color:var(--muted);letter-spacing:.06em;padding:12px 10px 6px}
nav a{display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;padding:9px 10px;border-radius:8px;font-size:13px}
nav a:hover{background:var(--side-2)}
nav a[aria-current=page]{background:var(--accent);color:#fff;font-weight:700}
nav .foot{margin-top:auto;font-size:10px;color:var(--muted);padding:8px 10px;line-height:1.6}
main{flex:1;min-width:0;display:flex}
iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
@media(max-width:760px){
 body{flex-direction:column}
 nav{flex:none;flex-direction:row;align-items:center;padding:8px;gap:4px;overflow-x:auto}
 .brand{padding:0 8px 0 4px}.brand div,.sec,nav .foot{display:none}
 nav a{white-space:nowrap;padding:7px 10px}
}
</style>
</head>
<body>
<nav aria-label="문서 탭">
 <div class="brand"><span class="logo">mai</span><div><b>maiReport</b><small>런칭 문서함</small></div></div>
 <span class="sec">프로토타입</span>
 <a href="#prototype" data-src="prototype.html">📱 최종 프로토타입</a>
 <span class="sec">아키텍처 구성</span>
 <a href="#architecture" data-src="architecture.html">🧭 지표 산출 데이터 플로우</a>
 <div class="foot">문서는 이 저장소에 파일을 추가하면 탭으로 늘어납니다.</div>
</nav>
<main><iframe id="view" title="문서 보기"></iframe></main>
<script>
const links=[...document.querySelectorAll('nav a[data-src]')],view=document.getElementById('view');
function go(){const l=links.find(a=>a.hash===location.hash)||links[0];links.forEach(a=>a.toggleAttribute('aria-current',a===l));if(l.hasAttribute('aria-current'))l.setAttribute('aria-current','page');if(view.getAttribute('src')!==l.dataset.src)view.src=l.dataset.src;document.title='maiReport · '+l.textContent.trim().slice(2).trim();}
addEventListener('hashchange',go);go();
</script>
</body>
</html>
